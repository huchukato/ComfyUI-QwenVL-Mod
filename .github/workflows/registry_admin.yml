name: Registry admin
on:
  workflow_dispatch:
    inputs:
      node_id:
        description: "Node id on the registry (e.g. ComfyUI-QwenVL-Mod)"
        required: true
        default: "ComfyUI-QwenVL-Mod"
      action:
        description: "Operation to perform"
        type: choice
        required: true
        default: "list"
        options:
          - list
          - set-changelog
          - deprecate
          - undeprecate
          - delete
      versions:
        description: "Version(s), comma-separated (e.g. 2.8.14 or 2.8.0,2.8.1)"
        required: false
        default: ""
      changelog:
        description: "Changelog text (only for set-changelog; uses first entry in 'versions')"
        required: false
        default: ""

jobs:
  admin:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'huchukato' }}
    steps:
      - name: Apply registry operation
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          NODE_ID: ${{ inputs.node_id }}
          ACTION: ${{ inputs.action }}
          VERSIONS: ${{ inputs.versions }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request

          publisher = "huchukato"
          node = os.environ["NODE_ID"]
          action = os.environ["ACTION"]
          versions = [v.strip() for v in os.environ["VERSIONS"].split(",") if v.strip()]
          token = os.environ["REGISTRY_TOKEN"]

          def req(method, url, body=None):
              r = urllib.request.Request(url, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              })
              if body is not None:
                  r.data = json.dumps(body).encode()
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          if action == "list":
              url = f"https://api.comfy.org/nodes/{node}/versions?limit=100"
              r = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(r) as resp:
                  data = json.loads(resp.read().decode())
              if isinstance(data, dict):
                  data = data.get("versions", [])
              for v in data:
                  cl = (v.get("changelog") or "").strip().splitlines()
                  print(f"{v.get('version'):10} {v.get('status','?'):28} "
                        f"{(v.get('createdAt') or '')[:10]}  changelog={cl[0][:60] if cl else '<empty>'}")
              sys.exit(0)

          if not versions:
              sys.exit("ERROR: 'versions' input is required for this action")

          for version in versions:
              url = f"https://api.comfy.org/publishers/{publisher}/nodes/{node}/versions/{version}"
              if action == "delete":
                  status, out = req("DELETE", url)
                  print(f"DELETE {version}: {status} {out[:300]}")
              elif action == "set-changelog":
                  if not os.environ["CHANGELOG"].strip():
                      sys.exit("ERROR: 'changelog' input is required for set-changelog")
                  status, out = req("PUT", url, {"changelog": os.environ["CHANGELOG"], "deprecated": False})
                  print(f"PUT changelog {version}: {status} {out[:300]}")
              elif action in ("deprecate", "undeprecate"):
                  status, out = req("PUT", url, {"deprecated": action == "deprecate"})
                  print(f"PUT deprecated={action == 'deprecate'} {version}: {status} {out[:300]}")
              else:
                  sys.exit(f"Unknown action {action}")
          PY
